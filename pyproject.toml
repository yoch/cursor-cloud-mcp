[project]
name = "cursor-cloud-mcp"
dynamic = ["version"]
description = "MCP server for Cursor Cloud Agents (background agents): launch, follow up, supervise and cost Cursor agents from Claude Code, Codex CLI or OpenCode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoch Melka" }]
requires-python = ">=3.12"
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "cursor",
  "cursor-ai",
  "cursor-cloud-agents",
  "background-agents",
  "cloud-agents",
  "claude-code",
  "codex",
  "opencode",
  "ai-agents",
  "coding-agents",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "mcp>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/yoch/cursor-cloud-mcp"
Repository = "https://github.com/yoch/cursor-cloud-mcp"
Issues = "https://github.com/yoch/cursor-cloud-mcp/issues"
Documentation = "https://github.com/yoch/cursor-cloud-mcp#readme"

[project.scripts]
cursor-cloud-mcp = "cursor_cloud_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cursor_cloud_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_cloud_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
