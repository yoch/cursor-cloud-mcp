[project]
name = "cursor-cloud-mcp"
version = "0.1.0"
description = "Serveur MCP stdio minimal pour l'API Cursor Cloud Agents v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.2.0",
]

[project.scripts]
cursor-cloud-mcp = "cursor_cloud_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_cloud_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
