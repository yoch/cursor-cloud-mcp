name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Locked install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Static check
        run: uvx ruff@0.16.10 check src tests scripts
      - name: Tests (no real Cursor call)
        run: uv run --locked pytest
      - name: Install the built package
        run: |
          uv build --wheel
          python_bin="$(uv python find ${{ matrix.python }})"
          "$python_bin" -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
